<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 160" role="img" aria-labelledby="t d">
  <title id="t">apitu 工作方式示意</title>
  <desc id="d">会话写 JSON，danger-full-access 下跑 CLI，侧栏打开本地 HTML。示意图，非截图。</desc>
  <rect width="960" height="160" rx="20" fill="#f4faf7"/>
  <rect x="24" y="28" width="200" height="104" rx="14" fill="#fff" stroke="#3d8f7a"/>
  <text x="124" y="76" text-anchor="middle" fill="#16302c" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">1 会话写 JSON</text>
  <text x="124" y="100" text-anchor="middle" fill="#4d6f67" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">schema / 源码证据</text>
  <rect x="260" y="28" width="200" height="104" rx="14" fill="#fff" stroke="#7a6bb8"/>
  <text x="360" y="76" text-anchor="middle" fill="#1b2438" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">2 工具 apitu</text>
  <text x="360" y="100" text-anchor="middle" fill="#5c5678" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">guide / run / preview</text>
  <rect x="496" y="28" width="200" height="104" rx="14" fill="#fff" stroke="#c9a227"/>
  <text x="596" y="76" text-anchor="middle" fill="#16302c" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">3 CLI finalize</text>
  <text x="596" y="100" text-anchor="middle" fill="#6a5a20" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">danger-full-access</text>
  <rect x="732" y="28" width="204" height="104" rx="14" fill="#fff" stroke="#3d8f7a"/>
  <text x="834" y="76" text-anchor="middle" fill="#16302c" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">4 打开 HTML</text>
  <text x="834" y="100" text-anchor="middle" fill="#4d6f67" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">侧栏 / 本机文件</text>
</svg>
